name: Continuous Integration
on: 
  workflow_dispatch:
  push:
    branches:
     - main
     - 1.9-dev
    tags:
     - 'v*'
  pull_request:
    branches:
     - main
     - 1.9-dev
jobs:
  test:
    outputs:
      version: ${{ steps.version.outputs.version }}
      git_commit_count: ${{ steps.version.outputs.git_commit_count }}
    strategy:
      matrix:
        include:
          # Only keep ONE Linux compiler to avoid duplicate package names
          - os: ubuntu-22.04
            os_short: linux
            compiler_cc: gcc-9
            compiler_cxx: g++-9
            compiler_install: 'gcc-9-multilib g++-9-multilib'
          - os: windows-2022
            os_short: windows
            compiler_cc: msvc
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os_short }}-${{ matrix.compiler_cc }}
    env:
      DEPENDENCIES_FOLDER: dependencies      
      DEPENDENCIES_ROOT: ${{ github.workspace }}/dependencies      
      DEPENDENCIES_ROOT_WIN: ${{ github.workspace }}\dependencies
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: amxmodx
          fetch-depth: 0
      
      - name: Compute version
        id: version
        working-directory: amxmodx
        shell: bash
        run: |
          PRODUCT_VERSION=$(cat product.version)
          GIT_COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="${PRODUCT_VERSION}.${GIT_COMMIT_COUNT}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "git_commit_count=${GIT_COMMIT_COUNT}" >> $GITHUB_OUTPUT
      
      # Setup Python for AMBuild
      - uses: actions/setup-python@v7
        name: Setup Python 3.10
        with:
          python-version: "3.10"
      
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 --version
      
      - name: Install AMXModX dependencies (Linux)
        if: startsWith(runner.os, 'Linux')
        shell: bash
        run: |
          mkdir -p ${{ env.DEPENDENCIES_FOLDER }}
          cd ${{ env.DEPENDENCIES_FOLDER }}
          
          # Satisfy checkout-deps requirement for a "amxmodx" folder.
          mkdir -p amxmodx
          ../amxmodx/support/checkout-deps.sh          
      
      - name: Install AMXModX dependencies (Windows)
        if: startsWith(runner.os, 'Windows')
        shell: cmd
        run: |
          mkdir %DEPENDENCIES_ROOT_WIN%\nasm
          curl -L -o "%DEPENDENCIES_ROOT_WIN%\nasm\nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/2.13.03/win32/nasm-2.13.03-win32.zip
          chdir %DEPENDENCIES_ROOT_WIN%\nasm
          7z x nasm.zip
          echo %DEPENDENCIES_ROOT_WIN%\nasm\nasm-2.13.03>> %GITHUB_PATH%
          
          chdir %DEPENDENCIES_ROOT_WIN%
          git clone https://github.com/alliedmodders/ambuild
          git clone https://github.com/alliedmodders/metamod-hl1 metamod-am
          git clone https://github.com/alliedmodders/hlsdk
          
          curl -L -o "mysql-connector-c-6.1.1-win32.zip" https://downloads.mysql.com/archives/get/p/19/file/mysql-connector-c-6.1.1-win32.zip
          7z x mysql-connector-c-6.1.1-win32.zip -o"mysql"
          cd mysql
          dir
          ren mysql-connector-c-6.1.1-win32 mysql-5.5
          move /Y mysql-5.5 ..\
          
          cd ..\ambuild
          python3 setup.py install          
      
      - name: Install Linux dependencies
        if: startsWith(runner.os, 'Linux')
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib libstdc++6 lib32stdc++6 \
            libc6-dev libc6-dev-i386 linux-libc-dev \
            linux-libc-dev:i386 lib32z1-dev nasm ${{ matrix.compiler_cc }} ${{ matrix.compiler_install }}
      
      - name: Select compiler
        if: startsWith(runner.os, 'Linux')
        run: |
          echo "CC=${{ matrix.compiler_cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.compiler_cxx }}" >> $GITHUB_ENV
          ${{ matrix.compiler_cc }} --version
          ${{ matrix.compiler_cxx }} --version
      
      - name: Build Linux
        if: startsWith(runner.os, 'Linux')
        working-directory: amxmodx
        run: |
          export LDFLAGS="$LDFLAGS -Wl,-z,noexecstack"
          mkdir build
          cd build
          python3 ../configure.py --enable-optimize --metamod=${{ env.DEPENDENCIES_ROOT }}/metamod-am --hlsdk=${{ env.DEPENDENCIES_ROOT }}/hlsdk --mysql=${{ env.DEPENDENCIES_ROOT }}/mysql-5.5
          ambuild

      - name: Bundle ReAPI module (Linux)
        if: startsWith(runner.os, 'Linux')
        working-directory: amxmodx
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Source the ReAPI module from the release matching the major.minor
          # in plugins/include/reapi_version.inc, so the bundled module always
          # agrees with the includes shipped in this same package.
          verfile=plugins/include/reapi_version.inc
          major=$(grep -oP '#define\s+REAPI_VERSION_MAJOR\s+\K[0-9]+' "$verfile")
          minor=$(grep -oP '#define\s+REAPI_VERSION_MINOR\s+\K[0-9]+' "$verfile")
          tag=$(gh release list --repo rehlds/ReAPI --limit 50 --json tagName --jq '.[].tagName' \
            | grep -m1 "^${major}\.${minor}\.") || true
          if [ -z "${tag:-}" ]; then
            echo "::error::No ReAPI release matching ${major}.${minor}.*"
            exit 1
          fi
          echo "Bundling ReAPI module from release $tag"
          tmp=$(mktemp -d)
          gh release download "$tag" --repo rehlds/ReAPI --pattern '*.zip' --dir "$tmp"
          unzip -q "$tmp"/*.zip -d "$tmp/x"
          dest=build/packages/cstrike/addons/amxmodx/modules
          if [ ! -d "$dest" ]; then
            echo "::error::cstrike package modules dir not found: $dest"
            exit 1
          fi
          cp "$tmp/x/addons/amxmodx/modules/reapi_amxx_i386.so" "$dest/"
          ls -l "$dest/reapi_amxx_i386.so"

      - name: Package Linux builds
        if: startsWith(runner.os, 'Linux')
        working-directory: amxmodx
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Create dist directory FØRST
          mkdir -p dist
          
          cd build/packages
          
          for pkg in base cstrike; do
            if [ -d "$pkg" ]; then
              echo "=== Packaging $pkg ==="
              cd "$pkg"
              
              # Create tar in absolute path to dist
              tar zcvf "$GITHUB_WORKSPACE/amxmodx/dist/amxmodx-${VERSION}-${pkg}-linux.tar.gz" addons
              
              cd ..
              echo "✓ Created amxmodx-${VERSION}-${pkg}-linux.tar.gz"
            else
              echo "⚠ Package directory not found: $pkg"
            fi
          done
          
          cd ../..
          echo ""
          echo "=== Final packages ==="
          ls -lh dist/
      
      - name: Upload Linux artifacts
        if: startsWith(runner.os, 'Linux') && always()
        uses: actions/upload-artifact@v7
        with:
          name: amxmodx-${{ matrix.os_short }}-${{ github.sha }}
          path: amxmodx/dist/*.tar.gz
          retention-days: 7
      
      - name: Build Windows
        if: startsWith(runner.os, 'Windows')
        working-directory: amxmodx
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\VC\Auxiliary\Build\vcvarsall.bat" x86 || exit /b 1
          cl.exe
          mkdir build
          cd build
          python3 ../configure.py --enable-optimize --metamod=${{ env.DEPENDENCIES_ROOT_WIN }}\metamod-am --hlsdk=${{ env.DEPENDENCIES_ROOT_WIN }}\hlsdk --mysql=${{ env.DEPENDENCIES_ROOT_WIN }}\mysql-5.5
          ambuild
      
      - name: Package Windows builds
        if: startsWith(runner.os, 'Windows')
        working-directory: amxmodx
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          
          # Create dist directory FØRST
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          
          Set-Location build\packages
          
          $packages = @('base', 'cstrike')
          
          foreach ($pkg in $packages) {
            if (Test-Path $pkg) {
              Write-Host "=== Packaging $pkg ==="
              Set-Location $pkg
              
              $archiveName = "$env:GITHUB_WORKSPACE\amxmodx\dist\amxmodx-$VERSION-$pkg-windows.zip"
              Compress-Archive -Path addons -DestinationPath $archiveName -Force
              
              Set-Location ..
              Write-Host "✓ Created amxmodx-$VERSION-$pkg-windows.zip"
            } else {
              Write-Host "⚠ Package directory not found: $pkg"
            }
          }
          
          Set-Location ..\..
          Write-Host ""
          Write-Host "=== Final packages ==="
          Get-ChildItem dist\
      
      - name: Upload Windows artifacts
        if: startsWith(runner.os, 'Windows') && always()
        uses: actions/upload-artifact@v7
        with:
          name: amxmodx-${{ matrix.os_short }}-${{ github.sha }}
          path: amxmodx/dist/*.zip
          retention-days: 7

  create-release:
    name: Create Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      
      - name: List all downloaded artifacts
        run: |
          echo "=== Downloaded artifacts structure ==="
          find artifacts -type f | sort
          echo ""
          echo "=== Package files count ==="
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) | wc -l
          echo ""
          echo "=== Package files by name ==="
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) | sort
      
      - name: Determine version
        id: ver
        run: |
          # Prefer job output version if present
          VERSION="${{ needs.test.outputs.version }}"
          if [ -z "$VERSION" ]; then
            # Fallback: compute from repository (requires checkout)
            echo "No job output version; computing fallback version"
            echo "1.10.0.0" > version.txt
            VERSION=$(cat version.txt)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          TITLE: ${{ startsWith(github.ref, 'refs/tags/v') && format('AMX Mod X {0}', steps.ver.outputs.version) || format('AMX Mod X Dev Build {0}', steps.ver.outputs.version) }}
          PRERELEASE: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          # GitHub's API occasionally answers with a 5xx "Unicorn" page;
          # retry instead of failing the whole release.
          retry() {
            local n=1 max=5
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "::error::'$*' failed after $max attempts"
                return 1
              fi
              echo "Attempt $n failed, retrying in $((n * 15))s..."
              sleep $((n * 15))
              n=$((n + 1))
            done
          }

          mapfile -t files < <(find artifacts -type f \
            \( -name '*-base-*' -o -name '*-cstrike-*' \) \
            \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::Expected 4 packages (base+cstrike for linux+windows), found ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi

          cat > notes.md <<EOF
          AMX Mod X automated build

          Version: ${VERSION}
          Commit: ${GITHUB_SHA}

          **Packages included:**
          - Base (all games)
          - Counter-Strike (cstrike)

          Each package is available for both Linux (.tar.gz) and Windows (.zip).
          EOF

          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            retry gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file notes.md "${flags[@]}"
          fi

          for f in "${files[@]}"; do
            retry gh release upload "$TAG" "$f" --clobber
          done
